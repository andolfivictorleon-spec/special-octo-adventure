<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Città Educativa</title>

    <link rel="stylesheet" href="style.css?v=3">
</head>

<body>

<header>
    <h1>🏙️ La mia città</h1>
    <p id="playerInfo"></p>
</header>


<main>

<section id="city">

    <button class="building" id="btn-municipio" onclick="openBuilding('municipio')">
        🏛️<br>
        Municipio
        <span class="lock">🔒</span>
    </button>


    <button class="building" id="btn-biblioteca" onclick="openBuilding('biblioteca')">
        📚<br>
        Biblioteca
        <span class="lock">🔒</span>
    </button>


    <button class="building" id="btn-laboratorio" onclick="openBuilding('laboratorio')">
        🔬<br>
        Laboratorio
        <span class="lock">🔒</span>
    </button>


    <button class="building" id="btn-museo" onclick="openBuilding('museo')">
        🎨<br>
        Museo d'Arte
        <span class="lock">🔒</span>
    </button>

</section>



<section id="gamePanel">

    <h2>Benvenuto!</h2>

    <p>
        Clicca un edificio per iniziare.
    </p>

</section>


</main>

<script src="data.js?v=3"></script>
<script src="buildings.js?v=3"></script>
<script src="game.js?v=3"></script>

</body>
</html>
