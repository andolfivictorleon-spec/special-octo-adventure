<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Città Educativa</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🏙️ La mia città</h1>
    <p id="playerInfo"></p>
</header>


<main>

<section id="city">

    <button class="building" onclick="openBuilding('municipio')">
        🏛️<br>
        Municipio
    </button>


    <button class="building" onclick="openBuilding('biblioteca')">
        📚<br>
        Biblioteca
    </button>


    <button class="building">
        🏠<br>
        Casa
    </button>


    <button class="building">
        🌳<br>
        Piazza
    </button>

</section>



<section id="gamePanel">

    <h2>Benvenuto!</h2>

    <p>
        Clicca un edificio per iniziare.
    </p>

</section>


</main>

<script src="data.js"></script>
<script src="buildings.js"></script>
<script src="game.js"></script>

</body>
</html>
