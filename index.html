<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Città Educativa</title>

    <link rel="stylesheet" href="style_v2.css">
</head>

<body>

<header>
    <h1>🏙️ La mia città</h1>
    <p id="playerInfo"></p>
</header>


<main>

<section id="city">

    <button class="building" id="btn-municipio" onclick="openBuilding('municipio')">
        🏛️<br>
        Municipio
        <span class="lock">🔒</span>
    </button>


    <button class="building" id="btn-biblioteca" onclick="openBuilding('biblioteca')">
        📚<br>
        Biblioteca
        <span class="lock">🔒</span>
    </button>


    <button class="building" id="btn-laboratorio" onclick="openBuilding('laboratorio')">
        🔬<br>
        Laboratorio
        <span class="lock">🔒</span>
    </button>


    <button class="building" id="btn-museo" onclick="openBuilding('museo')">
        🎨<br>
        Museo d'Arte
        <span class="lock">🔒</span>
    </button>


    <div id="player">🧑</div>

</section>


<div id="controls">

    <button id="btnSu" class="ctrlBtn">▲</button>

    <div class="controlsRiga">
        <button id="btnSinistra" class="ctrlBtn">◀</button>
        <button id="btnDestra" class="ctrlBtn">▶</button>
    </div>

    <button id="btnGiu" class="ctrlBtn">▼</button>

</div>



<section id="gamePanel">

    <h2>Benvenuto!</h2>

    <p>
        Clicca un edificio per iniziare.
    </p>

</section>


</main>

<script src="data_v2.js"></script>
<script src="buildings_v2.js"></script>
<script src="game_v2.js"></script>

</body>
</html>
