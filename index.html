<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Città Educativa</title>

    <link rel="stylesheet" href="style_v2.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<header>
    <h1>🏙️ La mia città</h1>
    <p id="playerInfo"></p>
    <button id="btnCambiaPersonaggio" class="quizButton">🔄 Cambia personaggio</button>
    <button id="btnImpostazioni" class="quizButton" onclick="apriImpostazioni()">⚙️</button>
</header>


<main>

<section id="selezionePersonaggio">

    <h2 id="titoloScelta">Scegli il tuo personaggio!</h2>

    <p id="sottotitoloScelta">Un personaggio 3D che si muove nella città</p>

    <div id="listaPersonaggi">

        <button class="opzionePersonaggio" style="background:#e74c3c" onclick="scegliPersonaggio('#e74c3c')"></button>
        <button class="opzionePersonaggio" style="background:#3498db" onclick="scegliPersonaggio('#3498db')"></button>
        <button class="opzionePersonaggio" style="background:#2ecc71" onclick="scegliPersonaggio('#2ecc71')"></button>
        <button class="opzionePersonaggio" style="background:#9b59b6" onclick="scegliPersonaggio('#9b59b6')"></button>
        <button class="opzionePersonaggio" style="background:#f39c12" onclick="scegliPersonaggio('#f39c12')"></button>
        <button class="opzionePersonaggio" style="background:#1abc9c" onclick="scegliPersonaggio('#1abc9c')"></button>
        <button class="opzionePersonaggio" style="background:#e91e8c" onclick="scegliPersonaggio('#e91e8c')"></button>
        <button class="opzionePersonaggio" style="background:#34495e" onclick="scegliPersonaggio('#34495e')"></button>

    </div>

</section>


<section id="city" class="nascosto">

    <canvas id="scena3D"></canvas>

</section>


<div id="controls" class="nascosto">

    <button id="btnSu" class="ctrlBtn">▲</button>

    <div class="controlsRiga">
        <button id="btnSinistra" class="ctrlBtn">◀</button>
        <button id="btnDestra" class="ctrlBtn">▶</button>
    </div>

    <button id="btnGiu" class="ctrlBtn">▼</button>

</div>



<section id="gamePanel">

    <h2 id="titoloBenvenuto">Benvenuto!</h2>

    <p id="testoBenvenuto">
        Clicca un edificio per iniziare.
    </p>

</section>


<div id="finestraImpostazioni" class="nascosto">

    <div id="corpoImpostazioni"></div>

</div>


</main>

<script src="data_v2.js"></script>
<script src="data_en.js"></script>
<script src="lingua.js"></script>
<script src="buildings_v2.js"></script>
<script src="game_v2.js"></script>

</body>
</html>
